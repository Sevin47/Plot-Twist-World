name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
defaults:
  run:
    working-directory: plot-twist-world-deploy/deploy
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PROTOMAPS_KEY: ${{ secrets.VITE_PROTOMAPS_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          # hCaptcha public site key. Must be a REPOSITORY secret, not an
          # Environment one (this job runs under no environment — see
          # "Hard-won lessons" #8 in HANDOFF.md). A missing secret resolves
          # to an empty string with no error, which ships a build where
          # "Play now" is rejected by Supabase's captcha protection.
          VITE_HCAPTCHA_SITE_KEY: ${{ secrets.VITE_HCAPTCHA_SITE_KEY }}
          # CARTO basemap key. Same REPOSITORY-secret rule as above. CARTO
          # watermarks anonymous basemap tiles ("API KEY REQUIRED" burned
          # into the PNG server-side), so a missing secret here ships a
          # build where every tile on the map carries the watermark.
          VITE_CARTO_KEY: ${{ secrets.VITE_CARTO_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: plot-twist-world-deploy/deploy/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
